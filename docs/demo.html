async function demoAPI(name,p){const data=st.data;const me=st.session.user;
 if(name==='dashboard'){
  data.calls=data.calls||[];data.approval_count=data.shoots.filter(x=>x.status==='pending_approval').length;
  return {...data,pafs:data.pafs,
   finance_emails:data.finance_emails||'',finance_delivery:data.finance_delivery||[],
   paf_options:[],user:me};
 }
 if(name==='save_finance_settings'){
  if(me.role!=='cmo')throw Error('Only CMO can edit Accounts recipients.');

  if(emails.some(x=>!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x)))throw Error('Check Accounts email address format.');
  data.finance_emails=[...new Set(emails)].join(', ');
  for(const paf of data.pafs.filter(x=>x.finance_notice_status==='awaiting_recipient')){
   if(data.finance_emails){paf.finance_notice_status='queued';data.finance_delivery.unshift({id:paf.id,show_name:paf.show_name,estimated_total:paf.estimated_total,finance_notice_status:'queued',recipient_count:emails.length,sent_count:0});data.logs.unshift({category:'approved_paf_accounts',recipient:data.finance_emails,success:0,detail:'DEMO ONLY — PAF delivery simulated, no email sent',created_at:new Date().toISOString()});}
  }
  stateSave();return {ok:true,recipients:emails.length};
 }
 if(name==='save_paf'){
  if(!['production_head','cmo'].includes(me.role))throw Error('Only Production Head / CMO can prepare PAFs.');
  const request=data.shoots.find(x=>x.id===Number(p.shoot_id));if(!request)throw Error('Select an EP request first.');

  let existing=data.pafs.find(x=>x.series_code===request.series_code);
  if(existing&&Number(p.id)!==existing.id)throw Error('This request already has a PAF. Edit that PAF.');
  if(existing&&!['draft','changes_requested'].includes(existing.status))throw Error('The PAF is locked during CMO review.');
  const items=(p.items||[]).map(x=>({...x,quantity:Number(x.quantity),rate:Number(x.rate),amount:Math.round(Number(x.quantity)*Number(x.rate)*100)/100}));
  if(!items.length||items.some(x=>!x.particulars||!Number.isFinite(x.amount)||x.quantity<=0||x.rate<0))throw Error('Complete valid expense lines.');
  const id=existing?.id||Math.max(1,...data.pafs.map(x=>x.id))+1;
  const obj={...existing,...p,id,series_code:request.series_code,ep_id:Number(request.ep_id),ep_name:data.staff.find(x=>x.id===Number(request.ep_id))?.name,shoot_start:group.map(x=>x.shoot_date).sort()[0],shoot_end:group.map(x=>x.shoot_date).sort().at(-1),show_name:p.show_name||request.title,location:p.location||request.venue,estimated_total:items.reduce((v,x)=>v+x.amount,0),status:existing?.status||'draft',finance_notice_status:'not_requested',approvals:existing?.approvals||[],items,shoot_count:group.length};
  if(existing)Object.assign(existing,obj);else data.pafs.unshift(obj);
  group.forEach(x=>x.paf_id=id);stateSave();return {ok:true,id,estimated_total:obj.estimated_total};
 }
 if(name==='paf_decision')throw Error('CMO approves PAF and shoot schedule together from Approval Center.');
 if(name==='save_staff'){
  if(me.role!=='cmo')throw Error('Only the CMO can edit staff.');let person={id:p.id?Number(p.id):Math.max(...data.staff.map(x=>x.id))+1,name:p.name,email:p.email,role:p.role,team:p.team,phone_e164:p.phone_e164||'',voice_language:p.voice_language||'ta',voice_opt_in:p.voice_opt_in?1:0,active:p.active?1:0};let ix=data.staff.findIndex(x=>x.id===person.id);if(ix>=0)data.staff[ix]=person;else data.staff.push(person);data.shoots=data.shoots.map(s=>demoDecorate(s));stateSave();return{ok:true};}

  const required=['name','email','role','team','phone_e164','voice_language','voice_opt_in'];
  if(required.some(x=>!keys.includes(x)))throw Error('CSV columns must match the provided template.');
  let created=0,updated=0;
  for(const raw of lines){if(!raw.trim())continue;let vals=raw.split(',').map(x=>x.trim().replace(/^"|"$/g,'')),r=Object.fromEntries(keys.map((k,i)=>[k,vals[i]||'']));

   let old=data.staff.find(x=>x.email.toLowerCase()===r.email.toLowerCase());let obj={...old,...r,id:old?.id||Math.max(0,...data.staff.map(x=>x.id))+1,active:1,voice_opt_in:['yes','true','1'].includes(r.voice_opt_in.toLowerCase())?1:0};

 }
 if(name==='save_shoot'){

  if(me.role==='production_head'&&!existing)throw Error('EP must raise the initial shoot request.');
  if(existing&&!['requested','changes_requested'].includes(existing.status))throw Error('Request is locked during CMO review.');
  if(me.role==='ep'&&existing&&(existing.ep_id!==me.id||existing.paf_id))throw Error('Production Head has started the PAF. Contact them for changes.');
  if(!p.title||!p.venue||!p.shoot_date)throw Error('Enter program, venue and shoot date.');

  if(end<beg)throw Error('End date must not be before start.');const days=existing?0:Math.round((end-beg)/86400000);
  if(days>29)throw Error('Maximum 30 dates per shoot request.');

  for(let i=0;i<=days;i++){
   let date=new Date(beg.getTime()+86400000*i).toISOString().slice(0,10);
   const newId=existing?.id||Math.max(200,...data.shoots.map(x=>x.id))+1;
   const assigned=me.role==='ep'?(existing?.assignments||[]).map(a=>a.id):(p.assigned_ids||[]).map(Number);
   const row=demoDecorate({...existing,...p,id:newId,series_code:series,shoot_date:date,ep_id:me.role==='ep'?me.id:Number(p.ep_id),paf_id:existing?.paf_id||null,assigned,status:existing?.status==='approved'?'changes_requested':existing?.status||'requested'});

 }
 if(name==='demo_miss_call'){
  if(me.role!=='cmo')throw Error('CMO demo only.');const call=data.calls?.find(x=>x.id===Number(p.call_id));if(!call)throw Error('Call not found');

  stateSave();return{ok:true};
 }
 if(name==='demo_confirm_call'){const call=data.calls?.find(x=>x.id===Number(p.call_id));if(!call)throw Error('Call not found');call.state='acknowledged';stateSave();return{ok:true};}
 const s=data.shoots.find(x=>x.id===Number(p.id));if(!s)throw Error('Shoot not found.');
 if(name==='submit'){
  if(!['production_head','cmo'].includes(me.role))throw Error('Only Production Head / CMO can submit a package.');
  let group=data.shoots.filter(x=>x.series_code===s.series_code),paf=data.pafs.find(x=>x.series_code===s.series_code);
  if(!paf||!['draft','changes_requested'].includes(paf.status))throw Error('Prepare the estimated PAF against the EP request first.');
  if(group.some(x=>!['requested','changes_requested'].includes(x.status)||!x.assignments?.length))throw Error('Assign crew for every shoot date before submitting.');
  group.forEach(x=>{for(const a of x.assignments){let conflict=data.shoots.find(y=>y.id!==x.id&&['approved','pending_approval'].includes(y.status)&&y.shoot_date===x.shoot_date&&y.reporting_time<x.end_time&&y.end_time>x.reporting_time&&y.assignments.some(z=>z.id===a.id));if(conflict)throw Error(a.name+' conflicts with '+conflict.title);}});
  paf.status='pending_cmo';group.forEach(x=>x.status='pending_approval');
  data.logs.unshift({category:'combined_cmo_approval',recipient:'CMO (demo)',success:0,detail:'Simulation only — no mail sent',created_at:new Date().toISOString()});stateSave();return {ok:true,message:'PAF + crew schedule sent together for CMO approval (demo).'};
 }
 if(name==='decision'){
  if(me.role!=='cmo'||s.status!=='pending_approval')throw Error('Only CMO can approve pending packages.');
  let group=data.shoots.filter(x=>x.series_code===s.series_code),paf=data.pafs.find(x=>x.series_code===s.series_code);
  if(!paf||paf.status!=='pending_cmo')throw Error('PAF is not awaiting CMO approval.');
  if(p.decision==='approve'){
   group.forEach(x=>{x.status='approved';x.approved_name=me.name;});paf.status='approved';paf.approvals.push({stage:'cmo',decision:'approve',actor_name:me.name,created_at:new Date().toISOString()});
   paf.finance_notice_status=data.finance_emails?'queued':'awaiting_recipient';
   data.finance_delivery.unshift({id:paf.id,show_name:paf.show_name,estimated_total:paf.estimated_total,finance_notice_status:paf.finance_notice_status,recipient_count:data.finance_emails?data.finance_emails.split(',').length:0,sent_count:0});
   data.logs.unshift({category:'approved_paf_accounts',recipient:data.finance_emails||'Accounts email not set',success:0,detail:data.finance_emails?'DEMO ONLY — notification simulated':'PAF awaiting Accounts email configuration',created_at:new Date().toISOString()});
   for(const shoot of group){for(const uid of [...new Set([Number(shoot.ep_id),...shoot.assignments.map(a=>Number(a.id))])]){
    const person=data.staff.find(x=>x.id===uid);if(!person)continue;

   }}
   data.logs.unshift({category:'crew_calendar',recipient:'Assigned staff (demo)',success:0,detail:'Demo only — no Microsoft events or emails created',created_at:new Date().toISOString()});

  stateSave();return {ok:true,message:p.decision==='approve'?'PAF + schedule approved. Finance mail, calendars and calls simulated only.':'PAF and schedule returned for changes.'};
 }
 if(name==='cancel'){s.status='cancelled';(data.calls||[]).filter(x=>x.shoot_id===s.id&&x.state==='queued').forEach(x=>x.state='cancelled');stateSave();return{ok:true};}

function user(){return st.session?.user}
function isAdmin(){return user()?.role==='cmo'}
function isHead(){return ['cmo','production_head'].includes(user()?.role)}
function canSeePAF(){return ['production_head','finance_head','cmo'].includes(user()?.role)}
function visiblePafs(){return canSeePAF()?(st.data?.pafs||[]):[];}
function availableShootRequests(){const ids=new Set((st.data?.pafs||[]).filter(p=>p.series_code).map(p=>p.series_code));return (st.data?.shoots||[]).filter(s=>['requested','changes_requested'].includes(s.status)&&!ids.has(s.series_code)).filter((s,i,a)=>a.findIndex(t=>t.series_code===s.series_code)===i);}
function canCreate(){return ['cmo','production_head','ep'].includes(user()?.role)}
function mine(s){return s.assignments?.some(a=>Number(a.id)===Number(user()?.id));}
function visShoots(){let all=st.data?.shoots||[];const u=user();return all.filter(s=>['cmo','production_head'].includes(u.role)||s.status==='approved'||(u.role==='ep'&&Number(s.ep_id)===Number(u.id)));}

function calendar(list){let [year,mo]=st.month.split('-').map(Number),first=(new Date(year,mo-1,1).getDay()+6)%7,daysIn=new Date(year,mo,0).getDate(),prev=new Date(year,mo-1,0).getDate(),today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});let out='<div class="cal">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="dayname">${x}</div>`).join('');for(let i=0;i<42;i++){let n=i-first+1,valid=n>=1&&n<=daysIn,actual=valid?n:n<1?prev+n:n-daysIn;let month=valid?mo:n<1?mo-1:mo+1;let date=new Date(year,month-1,actual,12).toISOString().slice(0,10),shoots=list.filter(s=>s.shoot_date===date);out+=`<button class="day ${!valid?'not-month':''} ${date===today?'today':''} ${date===st.selectedDate?'active':''}" data-action="pickday" data-date="${date}"><span class="day-number">${actual}</span>${shoots.slice(0,2).map(s=>`<span class="day-shoot">${e(s.title)}</span>`).join('')}${shoots.length>2?`<span class="day-count">+${shoots.length-2} more</span>`:''}</button>`;}return out+'</div>'}

  if(f.id==='shoot-form'){const o=formObject(f);if(!o.end_date)o.end_date=o.shoot_date;let result=await api('save_shoot',o);st.modal=null;st.view='schedule';st.selectedDate=o.shoot_date;st.month=o.shoot_date.slice(0,7);await refresh();flash(result.note||'Shooting request saved.');return;}
  if(f.id==='import-staff-form'){
   const file=f.elements.file.files[0];if(!file)throw Error('Choose a CSV first.');if(file.size>200000)throw Error('CSV must be smaller than 200 KB.');
   const out=await api('import_staff_csv',{csv:await file.text()});st.view='staff';await refresh();
   let line='Imported: '+out.created+' new, '+out.updated+' updated.';
   if(out.temporary_credentials?.length){
     const block=out.temporary_credentials.map(x=>x.name+' | '+x.email+' | '+x.temporary_password).join('\n');
     const downloadable=new Blob(['New employee temporary passwords — keep confidential\n'+block],{type:'text/plain'});const u=URL.createObjectURL(downloadable);let a=document.createElement('a');a.href=u;a.download='staff_temporary_passwords_private.txt';a.click();URL.revokeObjectURL(u);
     line+=' Initial passwords were downloaded once to your device; protect this file.';
   }
   flash(line);return;
  }
  if(f.id==='staff-form'){await api('save_staff',formObject(f));st.modal=null;await refresh();flash('Team member saved.');return;}
  if(f.id==='changes-form'){await api('decision',{id:Number(f.dataset.id),decision:'changes',reason:f.elements.reason.value});st.modal=null;await refresh();flash('Request returned for changes.');return;}
  if(f.id==='password-form'){await api('password',formObject(f));st.modal=null;await refresh();flash('Password changed.');return;}
 }catch(ex){flash(ex.message||'Unable to save',true)}
});
async function init(){try{if(DEMO){demoInit();st.data=await demoAPI('dashboard',{});}else{st.session=await api('session');if(st.session.user)st.data=await api('dashboard');}let param=new URLSearchParams(location.search).get('shoot');if(param&&st.session.user&&st.data.shoots.some(x=>x.id===Number(param)))st.modal={type:'details',id:Number(param)};const pafParam=new URLSearchParams(location.search).get('paf');if(pafParam&&st.session.user&&visiblePafs().some(x=>x.id===Number(pafParam)))st.modal={type:'pafdetails',id:Number(pafParam)};render();}catch(ex){document.getElementById('app').innerHTML=`<div style="max-width:560px;margin:20vh auto;padding:30px;background:white;border-radius:16px"><h2>Portal setup required</h2><p>${e(ex.message)}</p><p>Open README.md and configure MySQL, then reload.</p></div>`;}}
init();
})();
