name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run automated test suite
        run: npm run test -w @sankara/backend

      - name: Build shared packages
        run: npm run build -w @sankara/shared

      - name: Build frontend production bundle
        run: npm run build -w @sankara/frontend

      - name: Build admin production bundle
        run: npm run build -w @sankara/admin
